name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        # cal-sync-magic is a private repo, so CI runs without it — the
        # calendar app is optional and turns itself off when not installed.
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Checks
        run: ./scripts/checks.sh
