# Shared app config for both web Deployments. The database itself is
# deployed by pg-bootstrap.yaml (CloudNativePG); -rw is the write Service.
# Listed after pcfweb-secret in envFrom, so these keys win over any stale
# values in the secret.
apiVersion: v1
kind: ConfigMap
metadata:
  name: pcfweb-db-config
  namespace: pcfweb
data:
  DJANGO_CONFIGURATION: "Prod"
  DBHOST: "pcfweb-pg-rw"
  DBNAME: "pigscanfly"
  DBUSER: "pigscanfly"
  # The /discord invite, kept as two halves that are never concatenated
  # server-side: the page ships both to the browser only after a captcha and
  # lets JavaScript join them, so a crawler reading the HTML does not walk away
  # with a working invite. Split them anywhere -- the view only requires that
  # the halves concatenate to https://discord.gg/<code>.
  #
  # This is a ConfigMap, not a Secret: a Discord invite is a link we hand out
  # in public, so the value is not secret, it just should not be trivially
  # harvestable. Rotating the invite is an edit here plus a pod restart; unset
  # both halves and /discord becomes the "e-mail us for an invite" page.
  DISCORD_INVITE_PART_ONE: "https://discord.gg/aVU2"
  DISCORD_INVITE_PART_TWO: "2HAmb"
  # THE "FOLLOW ALONG" ACCOUNTS on the post-checkout page and in the buyer's
  # receipt. Three account holders, because "follow us" is three different
  # asks: Holden writes the books, PCFL publishes them and runs the Discord,
  # BREAD is Liberated Bread. Every name is listed here because none of them
  # is set: an account nobody has configured renders as nothing at all, and a
  # holder with nothing set renders no row -- so this commented block is the
  # only place the available names are visible. Uncomment and fill in the ones
  # that exist; adding one is an edit here plus a pod restart, not a rebuild.
  #
  # Only https URLs with a host in them render (main/socials.py), so a
  # half-finished edit costs a link rather than handing a visitor's browser
  # something unintended. SOCIAL_HOLDEN_YOUTUBE_URL already defaults to the
  # channel the about page links, so leaving it unset here keeps that.
  #
  # These replaced six unprefixed SOCIAL_<NETWORK>_URL names in July 2026 and
  # do not fall back to them: the old flat list said nothing about whose
  # account it held, so a fallback would have had to guess, and guessing wrong
  # publishes the company's account under Holden's name. An unrenamed variable
  # is simply not read.
  #
  # SOCIAL_HOLDEN_SITE_URL: ""
  # SOCIAL_HOLDEN_MASTODON_URL: ""
  # SOCIAL_HOLDEN_BLUESKY_URL: ""
  # SOCIAL_HOLDEN_YOUTUBE_URL: ""
  # SOCIAL_HOLDEN_TWITCH_URL: ""
  # SOCIAL_HOLDEN_INSTAGRAM_URL: ""
  # SOCIAL_HOLDEN_LINKEDIN_URL: ""
  # SOCIAL_PCFL_SITE_URL: ""        # normally empty: this site is the site
  # SOCIAL_PCFL_MASTODON_URL: ""
  # SOCIAL_PCFL_BLUESKY_URL: ""
  # SOCIAL_PCFL_YOUTUBE_URL: ""
  # SOCIAL_PCFL_TWITCH_URL: ""
  # SOCIAL_PCFL_INSTAGRAM_URL: ""
  # SOCIAL_PCFL_LINKEDIN_URL: ""
  # SOCIAL_BREAD_SITE_URL: ""       # defaults to www.liberatedbread.com
  # SOCIAL_BREAD_MASTODON_URL: ""
  # SOCIAL_BREAD_BLUESKY_URL: ""
  # SOCIAL_BREAD_YOUTUBE_URL: ""
  # SOCIAL_BREAD_TWITCH_URL: ""
  # SOCIAL_BREAD_INSTAGRAM_URL: ""
  # SOCIAL_BREAD_LINKEDIN_URL: ""
  # OUTBOUND MAIL -- the relay for order notifications, download links, the
  # book-asset audit and Django's 500 reports to ADMINS. These mirror the
  # Prod defaults in pigscanfly/settings.py, and a test pins the two files
  # to each other; change the relay here (plus a pod restart), not with a
  # rebuild. The one secret piece, EMAIL_HOST_PASSWORD, stays in
  # pcfweb-secret -- provisioned out of the colo-scripts vault
  # (playbooks/cluster-setup.yaml) -- and an empty password just turns SMTP
  # AUTH off. The full path, DNS included, is docs/email.md.
  #
  # The host is the domain's own mail server by its MX name, deliberately
  # not the bare apex: pigscanfly.ca resolves to Cloudflare edge IPs, which
  # do not carry SMTP, so mail pointed there hangs into the timeout on
  # every send. The domain's live SPF record already authorizes this relay
  # (its "mx" mechanism); if the relay ever changes, adjust that TXT record
  # where the DNS is actually served -- Cloudflare, not the retired bind
  # zone files in colo-scripts.
  #
  # 465 is the submissions port -- TLS from the first byte, for exactly
  # this shape of client: authenticated, handing mail in. Not 25, the
  # MTA-to-MTA relay port, which networks block outbound and servers often
  # refuse AUTH on. Should the server turn out not to listen on 465, the
  # flip is EMAIL_PORT "587" with EMAIL_USE_TLS "true" and EMAIL_USE_SSL
  # "false" (STARTTLS submission); setting both flags on refuses to boot.
  EMAIL_HOST: "mail.pigscanfly.ca"
  EMAIL_PORT: "465"
  EMAIL_USE_TLS: "false"
  EMAIL_USE_SSL: "true"
  EMAIL_HOST_USER: "support"
  #
  # Who gets a copy of the two emails a sale sends the buyer -- the receipt
  # and the download links. Comma-separated; "" copies nobody. Left unset so
  # the code default in settings.py applies; write it out only to change it,
  # which is an edit here plus a pod restart rather than a rebuild. Not
  # covered by the relay pinning test, deliberately: whose inbox this is
  # belongs to whoever runs the site. See docs/email.md for why the copy is
  # its own message rather than a Bcc.
  #
  # SALES_COPY_EMAILS: ""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-primary
  namespace: pcfweb
  labels:
    app: web-primary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-primary
  template:
    metadata:
      labels:
        app: web-primary
    spec:
      containers:
        - image: holdenk/pcfweb:v0.13.6
          name: pcfweb
          env:
          - name: PRIMARY
            value: "1"
          - name: DBPASSWORD
            valueFrom:
              secretKeyRef:
                name: pcfweb-internal-pg-secret
                key: password
          envFrom:
          - secretRef:
              name: pcfweb-secret
          - configMapRef:
              name: pcfweb-db-config
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              name: web
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 768Mi
          # /healthz runs a real query, so an unreachable database fails the
          # probe. `/` could not: SecurityMiddleware answers the kubelet's
          # plain-HTTP request with a 301 before any database access, and
          # Kubernetes counts a 3xx as success. The Host override is because
          # the kubelet otherwise sends the pod IP, which ALLOWED_HOSTS
          # rejects. See main/middleware.py.
          livenessProbe:
            httpGet:
              httpHeaders:
                - name: Host
                  value: "www.pigscanfly.ca"
              path: /healthz
              port: 80
            periodSeconds: 180
          readinessProbe:
            httpGet:
              httpHeaders:
                - name: Host
                  value: "www.pigscanfly.ca"
              path: /healthz
              port: 80
            periodSeconds: 10
          startupProbe:
            httpGet:
              httpHeaders:
                - name: Host
                  value: "www.pigscanfly.ca"
              path: /healthz
              port: 80
            periodSeconds: 10
            failureThreshold: 30
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: pcfweb
  labels:
    app: pcfweb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pcfweb
  template:
    metadata:
      labels:
        app: pcfweb
    spec:
      # web-primary applies the migrations, but both Deployments roll at the
      # same time, so these pods would otherwise start serving new code
      # against the old schema until it caught up. Block here instead: the
      # pod does not come up at all until the schema it expects is live.
      initContainers:
        - image: holdenk/pcfweb:v0.13.6
          name: wait-for-migrations
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -u
              export DJANGO_CONFIGURATION=${DJANGO_CONFIGURATION:-Prod}
              export DJANGO_SETTINGS_MODULE=${DJANGO_SETTINGS_MODULE:-pigscanfly.settings}
              cd /opt/app
              until ./manage.py migrate --check; do
                echo "Schema is behind (or the database is unreachable); waiting..."
                sleep 5
              done
              echo "Schema is current."
          env:
          - name: DBPASSWORD
            valueFrom:
              secretKeyRef:
                name: pcfweb-internal-pg-secret
                key: password
          envFrom:
          - secretRef:
              name: pcfweb-secret
          - configMapRef:
              name: pcfweb-db-config
          imagePullPolicy: Always
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
      containers:
        - image: holdenk/pcfweb:v0.13.6
          name: pcfweb
          env:
          - name: DBPASSWORD
            valueFrom:
              secretKeyRef:
                name: pcfweb-internal-pg-secret
                key: password
          envFrom:
          - secretRef:
              name: pcfweb-secret
          - configMapRef:
              name: pcfweb-db-config
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              name: web
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 768Mi
          # See the note on web-primary: /healthz reaches the database, `/`
          # would be short-circuited into a 301 by the HTTPS redirect.
          livenessProbe:
            httpGet:
              httpHeaders:
                - name: Host
                  value: "www.pigscanfly.ca"
              path: /healthz
              port: 80
            periodSeconds: 180
          readinessProbe:
            httpGet:
              httpHeaders:
                - name: Host
                  value: "www.pigscanfly.ca"
              path: /healthz
              port: 80
            periodSeconds: 10
          startupProbe:
            httpGet:
              httpHeaders:
                - name: Host
                  value: "www.pigscanfly.ca"
              path: /healthz
              port: 80
            periodSeconds: 10
            failureThreshold: 30
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: pcfweb
  name: web-svc
  namespace: pcfweb
spec:
  ports:
  - name: http
    port: 80
    protocol: TCP
    targetPort: web
  selector:
    app: pcfweb
  sessionAffinity: None
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pcfweb-ingress
  namespace: pcfweb
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    cert-manager.io/issue-temporary-certificate: "true"
    acme.cert-manager.io/http01-edit-in-place: "true"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
      - www.pigscanfly.ca
    secretName: pcf-tls-secret
  rules:
    - host: www.pigscanfly.ca
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name:  web-svc
                port:
                  number: 80
---
# The order sweeper. Stripe redelivers a webhook only when the *delivery*
# failed, so a fulfilment step that fails gracefully -- an SMTP blip, a slow
# line-item lookup, a missing book archive -- answers 200, and nothing ever
# comes back to retry it. This is what comes back. It also asks Stripe about
# orders still PENDING past the grace period, which is the only thing that
# notices a webhook that has stopped arriving at all (rotated secret,
# unregistered endpoint, pod clock drift).
#
# Hourly rather than every few minutes: the webhook is still the primary path
# and handles the overwhelming majority within seconds, so this is the repair
# pass, not the mechanism. A buyer waiting on a download after an SMTP outage
# waits at most an hour; the Stripe API cost is one lookup per genuinely
# stuck order.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: order-sweep
  namespace: pcfweb
  labels:
    app: pcfweb
spec:
  schedule: "17 * * * *"
  # Never two sweeps at once. The fulfilment lease would make an overlap safe
  # anyway, but a backlog of queued sweeps racing each other for the same
  # orders is noise nobody needs to read.
  concurrencyPolicy: Forbid
  # A missed window (a cluster upgrade, a paused node) is not worth catching
  # up on: the next hour's run covers everything the missed one would have.
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # One attempt. Anything the sweep could not finish is still recorded on
      # the order and picked up by the next hourly run, so a retry here would
      # only duplicate log noise.
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          containers:
            - image: holdenk/pcfweb:v0.13.6
              name: order-sweep
              command: ["/bin/bash", "-c"]
              args:
                - |
                  set -euo pipefail
                  export DJANGO_CONFIGURATION=${DJANGO_CONFIGURATION:-Prod}
                  export DJANGO_SETTINGS_MODULE=${DJANGO_SETTINGS_MODULE:-pigscanfly.settings}
                  cd /opt/app
                  # No --fail: a permanently broken order (a withheld
                  # download, an address Stripe never reported) would
                  # otherwise mark every run failed forever, and a red
                  # CronJob nobody can make green is a red CronJob nobody
                  # reads. The counts in the log are the signal.
                  ./manage.py sweep_orders
              env:
              - name: DBPASSWORD
                valueFrom:
                  secretKeyRef:
                    name: pcfweb-internal-pg-secret
                    key: password
              envFrom:
              - secretRef:
                  name: pcfweb-secret
              - configMapRef:
                  name: pcfweb-db-config
              imagePullPolicy: Always
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 512Mi
