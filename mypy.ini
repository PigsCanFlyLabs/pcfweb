# Global options:

[mypy]
# Target version, so the check doesn't retarget to whatever interpreter happens
# to invoke mypy.
python_version = 3.13
warn_return_any = False
warn_unused_configs = True
plugins = ./configurations_mypy_django_plugin.py
ignore_missing_imports = True


[mypy.plugins.django-stubs]
django_settings_module = "pigscanfly.settings"
django_configuration = "Dev"