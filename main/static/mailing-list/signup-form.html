<!--
  Pigs Can Fly Labs mailing list signup form.

  Paste this into any page on any site. It is plain HTML: no JavaScript, no
  stylesheet, nothing to load from us. The endpoint it posts to is CSRF
  exempt precisely so this works from another origin.

  Two values to set, explicit in the form -- nothing is inferred from which
  site the form is on:

    * "interest" -- the slug of the list people are signing up for. Leave it
      out entirely and they land on the general list. The slugs are in the
      admin under Interest areas.

    * "next" -- optional; where to send the visitor afterwards, so they stay
      on your site instead of landing on ours. See below.

  The "all_updates" checkbox is ticked by default. When it is ticked the
  person is subscribed to the "All" list instead of the topic above -- All
  receives every mailing, so it covers everything. Leave the checkbox in: it
  is what makes "everything" an opt-in the person can see and untick, rather
  than something we do to them quietly.

  ABOUT "next"

  Without it, the visitor lands on a thank-you page on pigscanfly.ca. With
  it, they land on the page you name -- but only if its host is on an
  allowlist we keep, and only over https. This endpoint is open to the
  internet, so without that allowlist it would be an open redirect with our
  domain on it.

  If the host is not on that allowlist, or the URL is anything other than a
  plain absolute https:// one, the field is silently ignored. The signup still
  happens; the visitor just sees our thank-you page instead.

  Signing up sends a confirmation email; nobody is added to the list until
  they click the link in it.
-->
<form class="pcf-signup" method="post"
      action="https://www.pigscanfly.ca/mailing-list/subscribe">
  <label for="pcf-signup-email">Subscribe to our mailing list</label>
  <input id="pcf-signup-email" type="email" name="email" required
         placeholder="you@example.com" autocomplete="email">

  <!-- Which list. Change or remove; removing means the general list. -->
  <input type="hidden" name="interest" value="general">

  <!-- Where to send them afterwards. Uncomment and point it at a page of
       your own; it must be an absolute https:// URL and its host must be on
       our allowlist. Anything else is ignored and they see our page. -->
  <!-- <input type="hidden" name="next" value="https://example.com/thanks/"> -->

  <label class="pcf-signup-all">
    <input type="checkbox" name="all_updates" value="1" checked>
    Send me all updates, not just this one
  </label>

  <!-- Spam trap. Invisible to people, filled in by bots. Keep it. -->
  <div style="position:absolute;left:-5000px;" aria-hidden="true">
    <input type="text" name="website" tabindex="-1" autocomplete="off">
  </div>

  <button type="submit">Subscribe</button>
</form>

<style>
/* Optional. Delete this block to inherit your own site's styling. */
.pcf-signup { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center;
              font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
.pcf-signup label { flex: 0 0 100%; font-weight: 600; }
.pcf-signup input[type=email] { flex: 1 1 12rem; min-width: 0;
                                padding: .55rem .7rem; font-size: 1rem;
                                border: 1px solid #b5b5b5; border-radius: 4px; }
.pcf-signup .pcf-signup-all { flex: 0 0 100%; font-weight: normal;
                              font-size: .9rem; }
.pcf-signup button { padding: .55rem 1.1rem; font-size: 1rem; border: 0;
                     border-radius: 4px; background: #f33f3f; color: #fff;
                     cursor: pointer; }
</style>
