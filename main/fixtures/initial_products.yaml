# Bootstrap products: Holden's books.
#
# These rows are fixture-owned: they use pks 100+ so they don't collide with
# products created directly in prod, and they are re-seeded on every deploy
# (web-primary runs `manage.py seed_products` after migrate), so edits made in
# the admin to these pks will be overwritten -- edit this file instead.
#
# external_product_id is intentionally unset; the Stripe product id is
# generated lazily on first add-to-cart (see CartProduct.generate_price_id).
#
# Four of the five O'Reilly titles below now carry an e-book ASIN, so they
# show the "Buy on Amazon (ebook)" button; pk 101 deliberately does not -- see
# the comment on that row. That button is driven by `ebook_asin` (or an
# explicit `kindle_link`) and renders only when one is set -- an absent value
# produces no button rather than a dead one.
#
# High Performance Spark ships as two rows: pk 101 is the 1st edition (Karau
# and Warren) and pk 108 is the 2nd (Karau, Polak and Warren, Spark 4.x).
# They are separate products with separate ISBNs, not one row
# updated in place -- the 1st edition is still in print and still sold, and
# overwriting it would have silently repointed every existing link to it.
# Both rows name their edition, as pk 100 does; neither is the unsuffixed
# "High Performance Spark".
#
# The values belong here, not in the admin. `ebook_asin` used to be in
# seed_products' SEED_PROTECTED_FIELDS, which made a fixture carrying one exit
# 1 -- and under `set -e` in scripts/start-server.sh, that stops the primary
# pod from booting -- so the only place to put an ASIN was the Django admin,
# retyped after every fresh database. It is fixture-owned now: put the ASIN
# here and a clean deploy seeds it. Take it from the Kindle edition's own
# Amazon page -- the /dp/ id on the *Kindle* listing, not the paperback's.
# There is no derivation from an ISBN: a guessed ASIN points at whatever
# unrelated product happens to occupy that address.
#
# The consequence is the usual one for this file -- a row whose ebook_asin is
# set below has its admin edits overwritten on each primary deploy. A row that
# OMITS the key keeps whatever the admin typed: seed_products passes only the
# keys present here to .update(), so an absent key is never written.
# print_asin, default_asin, external_product_id and stock stay admin/runtime-
# owned and must not appear in this file at all.
#
# Cross-links (`x_links`, `ebook_x_links`) are many-to-many and are written by
# a second pass in seed_products, not by the create/update that handles every
# other key here -- neither of those can carry an M2M at all. Two rules follow
# from how that pass works, and breaking either one stops the primary pod
# booting under `set -e`:
#
#   1. Every pk named must exist. Forward references are fine (104 names 106
#      below, which is read later); references to nothing are not.
#   2. `x_links` is SYMMETRICAL, so any two rows that both declare it must
#      list each other. 104 lists 105 and 106, so 105 and 106 each list 104.
#      A one-sided declaration seeds and then unseeds itself depending on
#      fixture order, so seed_products rejects it rather than guessing.
#
# `ebook_x_links` is directional and takes no such pairing: a print row points
# at the e-book row, and the e-book does not point back at the paperback.
- model: main.product
  pk: 100
  fields:
    name: "Learning Spark (1st edition)"
    description: >-
      Data in all domains is getting bigger, and Apache Spark makes working
      with it fast and expressive. Written by the early Spark team (including
      Holden Karau), this book introduces Spark's core APIs in Python, Java,
      and Scala -- from simple batch jobs to streaming and MLlib.
    price: 3999
    isbn: "9781449358624"
    print_isbn: "9781449358624"
    # Retail EPUB ISBN. Deliberately distinct from both the print ISBN above
    # and O'Reilly's own platform id in /library/view/ URLs (9781449359034),
    # which is a third number and not used here.
    ebook_isbn: "9781449359058"
    # Kindle edition ASIN, verified against the live Amazon listing. Drives
    # get_kindle_link(); never falls back to default_asin, which would point
    # the "Buy on Kindle" link at a paperback.
    ebook_asin: "B00SW0TY8O"
    amazon_link: "https://www.amazon.com/dp/1449358624"
    # No bookshop_link: the 2015 1st edition is absent from Bookshop's
    # catalogue entirely, and the ISBN search we used to link to returns
    # "No results found." Deliberately not repointed at the 2nd edition
    # (ean 9781492050049, Wenig/Damji) -- that is a different book by
    # different authors, so linking it would misrepresent this product.
    # No link beats a button that lands on an empty search page.
    amazon_in_link: "https://www.amazon.in/dp/1449358624"
    flipkart_link: "https://www.flipkart.com/search?q=9781449358624"
    image_name: "book_covers/learning_spark_1ed.jpg"
    cat: "B"
    tax_code: "txcd_35010000"
    # A 2015 book about Spark 1.x, superseded by a 2nd edition that is a
    # different book by different authors. Advisory only: this stays on sale
    # and stays listed, and the flag adds nothing but a sentence saying the
    # edition may be dated. `noorder` is what stops a sale, and it is not set
    # here and must not be added -- people buy this one deliberately.
    out_of_date: true
    # On O'Reilly's learning platform, so the Safari trial link is a
    # true statement for this title. Explicit rather than inferred from
    # the ISBN -- see Product.on_oreilly_safari.
    on_oreilly_safari: true
    release_date: 2015-02-27
