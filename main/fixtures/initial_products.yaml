# "Distributed Computing 4 Kids (and Executives)", in three SKUs sharing one
# cover. Unlike the four O'Reilly titles above, this one is ours to sell and
# ours to hand out -- which is what sells_ebook records on the e-book.
#
# Both print editions' ISBNs are assigned and set below, and they are
# different from each other -- a distinct ISBN is the entire premise of the
# Executive Edition, and get_gtin() feeds the Google Merchant feed, where two
# SKUs sharing one id is a duplicate. Add each real ISBN here as it is
# assigned; never placehold one with zeros or a copy of a sibling's.
#
# The e-book's ISBN lives in `ebook_isbn`, never in `isbn` -- an EPUB gets its
# own ISBN, and get_display_text() offers "available signed on request"
# whenever `print_isbn` is set, which for a PDF would mean offering to sign a
# download.
#
# Each row carries exactly the identifier for the format it actually is:
# print-only SKUs get `print_isbn`, the digital SKU gets `ebook_isbn`, and
# neither is copied across to the other. get_gtin() resolves
# `print_isbn or ebook_isbn or upc`, so duplicating one identifier onto a
# sibling row would give two SKUs the same GTIN in the Google Merchant feed --
# which the catalogue-wide uniqueness test correctly rejects.
- model: main.product
  pk: 104
  fields:
    name: "Distributed Computing 4 Kids (and Executives)"
    description: |-
      How do you solve the biggest problems of today? You harness the power of teamwork, with computers, friends, or garden gnomes. Distributed Computing 4 Kids and Executives teaches how to solve big problems with garden gnomes (and later computers). These techniques power modern AI, search, and recommendation systems.

      This book is for kids interested in learning how to solve large problems, or executives looking to understand what their data science team is up to and why their cloud and AI bill keeps growing.

      The book is in two parts going from garden gnomes in part one to computers in part two. The first part explains the concepts of distributed computing like how work can be split up and combined.

      For readers looking to turn the concepts into reality the second part goes into actual code with Python and Apache Spark, a distributed computing framework.

      Both kids and Executives can benefit from having helpers if they choose to pursue the second part, although they'll find them in different places. For kids a librarian or parent who understands computers can be a great helper. Executives should reach out to their data science group or experienced intern who may be able to help them connect to their actual business data.

      Big Data and Large Language Models don't have to mean a big headache. Grab your helper, pour some tea, and get started!
    price: 2000
    # Standard print edition. Self-published, so this ISBN is ours; it is not
    # an O'Reilly title and on_oreilly_safari stays unset accordingly.
    isbn: "9781960595997"
    # Print-only SKU, so the print ISBN and nothing else. `isbn` is the legacy
    # column; the migration's isbn -> print_isbn backfill runs before this row
    # exists, so print_isbn has to be set here explicitly or this SKU loses its
    # <g:gtin> in the Merchant feed and its "signed on request" note.
    print_isbn: "9781960595997"
    image_name: "book_covers/distributed_computing_4_kids.jpg"
    cat: "B"
    # get_brand() defaults the Books category to O'Reilly, which is right for
    # the four titles above and wrong for this one.
    brand: "Pigs Can Fly Labs"
    tax_code: "txcd_35010000"
    delivery_type: "PHYSICAL"
    sells_ebook: false
