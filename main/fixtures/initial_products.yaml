# "Fast Data Processing with Spark" (Packt, 2013) -- Holden's first book and
# the first book written about Apache Spark. Listed for the history, not for
# sale: noorder makes is_purchasable() false, which suppresses the buy button,
# and keeps the row out of /products, the homepage highlights and the Google
# Merchant feed. It keeps a product page, reachable by direct link and by
# /book/9781782167068, which is what the /services credentials link to.
#
# print_asin is deliberately NOT set here even though the ASIN is known
# (1782167064). print_asin is still in seed_products' SEED_PROTECTED_FIELDS
# (only ebook_asin was moved out), so a fixture carrying one makes the seed
# command exit 1 -- which under `set -e` in scripts/start-server.sh stops the
# primary pod from booting. It is also redundant: get_amazon_link() prefers an
# explicit amazon_link, which is set below, so the ASIN would never be
# consulted for this row. Set it in the admin if it is ever wanted.
#
# ebook_asin is unset for a different reason: no Kindle edition ASIN has been
# verified for this title. Unlike print_asin it is now fixture-owned, so it
# can simply be added here once one is confirmed.
