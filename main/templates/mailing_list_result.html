{% extends 'external-base.html' %}
{% block content %}
  <p>{{ message }}</p>
  {% if ok %}
    <p>We only mail when there is something worth saying, and every message
      has an unsubscribe link in it.</p>
  {% else %}
    <p><a href="{% url 'subscribe' %}">Try again</a></p>
  {% endif %}
{% endblock content %}
