{% extends 'base.html' %}

{% block content %}
<div class="container">
    <section class="section" style="min-height: 35.6vh;">
        {% if messages %}
        <div class="row">
            <div class="col-lg-12">
                {% for message in messages %}
                <div class="alert alert-warning" role="alert">{{ message }}</div>
                {% endfor %}
            </div>
        </div>
        {% endif %}
        <div class="section-heading text-center">
            <h2>Checkout Cancelled!</h2>
            <p>You have cancelled your checkout.</p>
        </div>
    </section>
</div>
{% endblock content %}
